services:
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/002_demo_podaci.sql:/docker-entrypoint-initdb.d/002_demo_podaci.sql:ro
      - ./db/003_zastita_termina.sql:/docker-entrypoint-initdb.d/003_zastita_termina.sql:ro
      - ./db/004_sesije.sql:/docker-entrypoint-initdb.d/004_sesije.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data: